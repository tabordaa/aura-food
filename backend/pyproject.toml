[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: FastAPI declares dependencies as default arguments (Depends(...)) by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Product seed rows are intentionally kept one per line.
"seed.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
